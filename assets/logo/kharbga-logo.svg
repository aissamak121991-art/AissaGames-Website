<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="Kharbga">
  <defs>
    <linearGradient id="kBoard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a4d38"/>
      <stop offset="1" stop-color="#0b1531"/>
    </linearGradient>
    <linearGradient id="kGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d492"/>
      <stop offset="1" stop-color="#b98a2e"/>
    </linearGradient>
    <radialGradient id="kEmerald" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7fe6bf"/>
      <stop offset="1" stop-color="#0f6a4d"/>
    </radialGradient>
    <linearGradient id="kText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#dfe6f0"/>
    </linearGradient>
  </defs>
  <!-- mini board mark -->
  <g transform="translate(6,8)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="url(#kBoard)" stroke="url(#kGold)" stroke-width="1.2" opacity="0.95"/>
    <g stroke="rgba(127,230,191,0.28)" stroke-width="1">
      <line x1="0" y1="18.6" x2="56" y2="18.6"/>
      <line x1="0" y1="37.3" x2="56" y2="37.3"/>
      <line x1="18.6" y1="0" x2="18.6" y2="56"/>
      <line x1="37.3" y1="0" x2="37.3" y2="56"/>
    </g>
    <circle cx="9.3" cy="9.3" r="5.4" fill="url(#kGold)"/>
    <circle cx="46.6" cy="46.6" r="5.4" fill="url(#kEmerald)"/>
    <circle cx="46.6" cy="9.3" r="5.4" fill="url(#kEmerald)"/>
    <circle cx="9.3" cy="46.6" r="5.4" fill="url(#kGold)"/>
    <circle cx="28" cy="28" r="5.8" fill="url(#kGold)" stroke="#04140d" stroke-width="0.6"/>
  </g>
  <text x="76" y="40" font-family="'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="url(#kText)">KHARBGA</text>
  <text x="78" y="57" font-family="'Segoe UI', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="4" fill="#e6c069">STRATEGY · HERITAGE</text>
</svg>
